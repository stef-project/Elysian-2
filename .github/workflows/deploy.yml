name: Build and Deploy to Hostinger

# Se déclenche à chaque push sur main, ou manuellement depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le site (build)
        run: npm run build

      - name: Déployer sur Hostinger par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # On n'envoie QUE le dossier compilé...
          local-dir: ./dist/
          # ...vers la racine web de Hostinger.
          server-dir: /public_html/
          # On ne touche pas au backend PHP éventuel (get-companies.php, etc.).
          exclude: |
            **/*.php
            **/.git*
            **/.git*/**
